name: Deploy site

on:
  push:
    branches: [main, content/veil]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out landing site
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Check out private encyclopedia sources
        uses: actions/checkout@v7
        with:
          repository: St1ggy/obsidian
          ref: main
          path: _content/obsidian
          ssh-key: ${{ secrets.OBSIDIAN_READ_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            _content/obsidian/Games/TRPG/SWADE/veil/web/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/configure-pages@v6

      - name: Install landing dependencies
        run: npm ci

      - name: Prepare Veil wiki generator
        working-directory: _content/obsidian/Games/TRPG/SWADE/veil
        run: python3 -m venv .venv && .venv/bin/pip install PyYAML

      - name: Build Veil encyclopedia
        working-directory: _content/obsidian/Games/TRPG/SWADE/veil/web
        env:
          SITE_URL: https://st1ggy.github.io
          BASE_PATH: /games/trpg/swade/veil
        run: |
          npm ci --force
          npm run build

      - name: Build landing site
        run: npm run build

      - name: Add Veil to Pages artifact
        run: |
          mkdir -p dist/games/trpg/swade/veil
          cp -R _content/obsidian/Games/TRPG/SWADE/veil/site/. dist/games/trpg/swade/veil/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
